version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. Dependabot bumps the pin and the
  # human-readable version comment together, so the workflows' supply-chain
  # hardening stays maintainable (this also SHA-pins oven-sh/setup-bun@v2).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Dependencies for the package (React peer + tsup/typescript/oxlint tooling).
  # Bun is the package manager (bun.lock), but Dependabot's npm ecosystem reads
  # package.json and understands Bun lockfiles, so version bumps keep working.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development
