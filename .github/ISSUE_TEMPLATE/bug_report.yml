name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Render `<CookieConsent config={{ ... }} />` with ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Version of `@gceico/cookie-consent` you're using.
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: React / framework version
      description: e.g. React 18/19, Next.js, Astro islands, Vite, etc.
    validations:
      required: false
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: false
